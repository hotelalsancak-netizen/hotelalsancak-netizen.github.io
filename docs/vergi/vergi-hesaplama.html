<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Vergi Hesaplama Notu — Riva Hotel Alsancak</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
  :root{color-scheme:light dark;--g:#F2F3F5;--s:#FFF;--i:#161C24;--m:#5C6875;
        --r:#D8DCE2;--a:#0E6B5C;--as:#E3F0ED;--c:#A8271D}
  @media (prefers-color-scheme:dark){:root{--g:#12161B;--s:#1A1F26;--i:#E7EAEE;
        --m:#98A2AE;--r:#2C333C;--a:#4FBFAA;--as:#12332E;--c:#E8877E}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--g);color:var(--i);
       font:15px/1.6 "Source Serif 4",Georgia,serif}
  img{max-width:100%}
  [hidden]{display:none!important}
  .gate{min-height:100%;display:flex;align-items:center;justify-content:center;
        padding:60px 20px}
  .box{background:var(--s);border:1px solid var(--r);border-left:4px solid var(--a);
       padding:26px 24px;max-width:430px;width:100%;
       display:flex;flex-direction:column;gap:14px}
  .eye{font:600 11.5px/1 "IBM Plex Mono",monospace;letter-spacing:.12em;
       text-transform:uppercase;color:var(--a)}
  h1{font:700 23px/1.2 "Archivo",system-ui,sans-serif;margin:0;letter-spacing:-.01em}
  p{margin:0;color:var(--m);font-size:14.5px}
  label{font:600 12px/1 "Archivo",system-ui,sans-serif;letter-spacing:.03em}
  .row{display:flex;flex-direction:column;gap:7px}
  input{font:15px "IBM Plex Mono",monospace;padding:10px 12px;width:100%;
        background:var(--g);color:var(--i);border:1px solid var(--r);border-radius:3px}
  input:focus-visible{outline:2px solid var(--a);outline-offset:1px}
  button{font:600 14px "Archivo",system-ui,sans-serif;padding:10px 18px;cursor:pointer;
         background:var(--a);color:var(--g);border:none;border-radius:3px;align-self:flex-start}
  button:focus-visible{outline:2px solid var(--i);outline-offset:2px}
  .err{color:var(--c);font-size:13.5px;font-family:"IBM Plex Mono",monospace}
</style>
</head>
<body>
<div class="gate" id="gate">
  <form class="box" id="frm">
    <div class="eye">Riva Hotel Alsancak</div>
    <h1>Vergi Hesaplama Notu</h1>
    <p>Bu belge otelin mali rakamlarını içerdiği için şifrelidir. Panodaki
       <b>yönetim parolası</b> ile açılır. Parola bu dosyada saklı değildir ve
       hiçbir yere gönderilmez — çözme işlemi tamamen bu tarayıcıda yapılır.</p>
    <div class="row">
      <label for="pw">Yönetim parolası</label>
      <input id="pw" type="password" autocomplete="current-password" autofocus>
    </div>
    <button type="submit" id="go">Aç</button>
    <div class="err" id="err" hidden>Parola yanlış — belge açılamadı.</div>
  </form>
</div>
<div id="out" hidden></div>

<script>
(function(){
  var b64d = function(s){ return Uint8Array.from(atob(s), function(c){ return c.charCodeAt(0); }); };
  async function deriveKey(pw, salt, iter){
    var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw),
      "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({name:"PBKDF2", salt:salt, iterations:iter, hash:"SHA-256"},
      base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  }
  async function open_(blob, pw){
    var boxes = Array.isArray(blob.variants) ? blob.variants : [blob];
    for (var i=0;i<boxes.length;i++){
      try{
        var b = boxes[i];
        var key = await deriveKey(pw, b64d(b.salt), b.iter);
        var pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64d(b.iv)}, key, b64d(b.ct));
        return JSON.parse(new TextDecoder().decode(pt));
      }catch(e){ /* bu kutu bu parolayla açılmadı, sonrakini dene */ }
    }
    return null;
  }
  var BLOB = JSON.parse(document.getElementById("blob").textContent);
  document.getElementById("frm").addEventListener("submit", async function(ev){
    ev.preventDefault();
    var err = document.getElementById("err"), go = document.getElementById("go");
    err.hidden = true; go.disabled = true; go.textContent = "Açılıyor…";
    var sec = await open_(BLOB, document.getElementById("pw").value);
    go.disabled = false; go.textContent = "Aç";
    if (!sec){ err.hidden = false; return; }
    var out = document.getElementById("out");
    out.innerHTML = sec.html;
    document.getElementById("gate").hidden = true;
    out.hidden = false;
    window.scrollTo(0,0);
  });
})();
</script>
