name: Fiyat bandi

# 30 oda kurali (fiyat_bandi.py): bir gece 30 oda ve ustu satilinca o gecenin Elektra temel
# fiyatini fiyat listesindeki normal plana cikarir. Her calismada Elektra gunluk euro kurunu okur, TL
# fiyat listenin altina dusmesin ve en fazla 5 TL ustunde kalsin diye € fiyatlari ayarlar (26.10.2026).
# Listeden %6 uzak (elle girilmis ozel) fiyata dokunmaz (elle girilen
# fiyatlar korunur), normal plana cikmis geceyi baslangica DUSURMEZ, fiyati girilmemis (satisa kapali)
# geceyi acmaz.
# Elektra yeni fiyati kanallara kendisi gonderir. Satisin cogu ayni gun 16-21 arasi geldigi
# icin yarim saatte bir calismasi gerekir; GitHub schedule bunu 2-4 saate uzattigi icin asil
# tetikleyici pano-nabzi.yml (30 dk zincir). Asagidaki schedule yalnizca yedek.

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fiyat-bandi
  cancel-in-progress: false

jobs:
  bant:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: 30 oda kurali
        env:
          ELEKTRA_HOTELID: ${{ secrets.ELEKTRA_HOTELID }}
          ELEKTRA_USER: ${{ secrets.ELEKTRA_USER }}
          ELEKTRA_PASS: ${{ secrets.ELEKTRA_PASS }}
        run: python fiyat_bandi.py
