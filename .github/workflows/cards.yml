name: Kart Analizi (otomatik)

# Yeni bir haftalık kart dosyası (site_data/cardreads-incoming/*.zip.enc) repoya push
# edilince ÇÖZER → ANALİZ EDER → şifreli kart bloğunu (site_data/kart/) commit'ler.
# O commit dashboard.yml'i tetikler → dashboard yeniden yayınlanır. Yani terminal
# programı dosyayı atınca gerisi otomatik; elle "analiz et" demeye gerek kalmaz.
#
# GEREKLİ SECRET: CARD_ZIP_PASSWORD (terminal programındaki parolayla BİREBİR aynı).
# Ayarla: repo → Settings → Secrets and variables → Actions → New repository secret.

on:
  push:
    paths: ['site_data/cardreads-incoming/**']   # yeni .zip.enc gelince anında
  workflow_dispatch:                              # elle tetikleme
  schedule:
    - cron: '30 6 * * *'                          # TR 09:30 — yedek günlük tarama

permissions:
  contents: write        # kart bloğunu geri commit'lemek için

concurrency:
  group: cards
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: poppler (pdftotext) kur
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Bağımlılıklar
        run: pip install -r requirements.txt
      - name: İşlenmemiş kart dosyalarını analiz et
        env:
          ELEKTRA_HOTELID: ${{ secrets.ELEKTRA_HOTELID }}
          ELEKTRA_USER: ${{ secrets.ELEKTRA_USER }}
          ELEKTRA_PASS: ${{ secrets.ELEKTRA_PASS }}
          DASH_PW_MANAGER: ${{ secrets.DASH_PW_MANAGER }}
          DASH_PW_RECEPTION: ${{ secrets.DASH_PW_RECEPTION }}
          CARD_ZIP_PASSWORD: ${{ secrets.CARD_ZIP_PASSWORD }}
        run: |
          python - <<'EOF'
          import glob, hashlib, json, pathlib, subprocess, sys
          sys.path.insert(0, '.')
          import kart_yukle

          # 14.09.2026: döküm repoya İKİ KEZ düştü (önce 115 KB'lık yarım dosya, 2 saat sonra
          # tam dosya). Eski kontrol sadece "hafta bloğu var mı" diye bakıyordu, bu yüzden tam
          # dosya bir daha işlenmedi ve pano tek odalık boş bir raporu "0 şüpheli" diye
          # gösterdi. Artık kaynağın sha256'sını da saklıyoruz: dosya değişirse hafta YENİDEN
          # üretilir. (Yarım dosyanın kendisini kart_yukle.py'deki MIN_ROOMS/MIN_READS eşiği
          # ayrıca durdurur — o zaman blok hiç oluşmaz ve sonraki yükleme normal işlenir.)
          # Kayıt DOSYA ADINA göre tutulur, hafta kimliğine göre değil: iki ayrı döküm
          # (ör. 20260803 ve 20260804) aynı haftaya düşebiliyor; haftaya göre saklasaydık
          # biri hep eşleşmez ve her çalışmada boşuna yeniden üretilirdi.
          SRC = pathlib.Path('site_data/kart/sources.json')
          srcs = json.loads(SRC.read_text(encoding='utf-8')) if SRC.exists() else {}
          todo = []
          for enc in sorted(glob.glob('site_data/cardreads-incoming/*.zip.enc')):
              name = pathlib.Path(enc).name
              lo, hi = kart_yukle.week_of(None, name)
              wid = lo.strftime('%Y%m%d')
              digest = hashlib.sha256(pathlib.Path(enc).read_bytes()).hexdigest()
              done = pathlib.Path(f'site_data/kart/{wid}.enc.json').exists()
              if done and srcs.get(name, {}).get('sha256') == digest:
                  continue
              if done and name in srcs:
                  print(f'==> {name}: kaynak dosya DEĞİŞMİŞ — {wid} haftası yeniden üretilecek.')
              todo.append((enc, name, wid, digest))
          if not todo:
              print('Yeni (işlenmemiş) kart dosyası yok — çıkılıyor.')
          # Bir dosya bozuksa diğer haftalar da işlenemesin istemiyoruz: hata verse bile
          # devam ediyoruz ve o haftanın kaydını YAZMIYORUZ (sonraki çalışmada tekrar dener).
          # Başarısız hafta panoda hiç görünmez — bu, yanlış bir "0 şüpheli"den çok daha iyidir.
          hatali = []
          for enc, name, wid, digest in todo:
              print('==> İşleniyor:', enc)
              r = subprocess.run([sys.executable, 'kart_yukle.py', enc, '--no-publish'])
              if r.returncode != 0:
                  hatali.append(name)
                  print(f'!!! {name} İŞLENEMEDİ — {wid} haftası üretilmedi (panoda görünmeyecek).')
                  continue
              srcs[name] = {'week': wid, 'sha256': digest}
              SRC.write_text(json.dumps(srcs, ensure_ascii=False, indent=1), encoding='utf-8')
          if hatali:
              print('!!! ÖZET — işlenemeyen döküm(ler):', ', '.join(hatali))
              print('!!! Büyük ihtimalle yükleme yarım kaldı; dökümü yeniden yükleyin.')
          EOF
      - name: Kart bloğunu commit'le + push (değiştiyse)
        run: |
          if [ -n "$(git status --porcelain site_data/kart/)" ]; then
            git config user.name "riva-cards-bot"
            git config user.email "cards-bot@users.noreply.github.com"
            git add site_data/kart/
            git commit -m "Kart güvenliği: otomatik analiz ($(date -u +%Y-%m-%d))"
            git push
            echo "Kart bloğu push edildi → dashboard yeniden yayınlanacak."
          else
            echo "Yeni analiz yok — commit gerekmiyor."
          fi
